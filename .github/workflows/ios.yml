# Builds the iPhone and iPad app on one of GitHub's macOS machines, since iOS
# apps can only be built on a Mac. Runs on every push to main that touches the
# app, or by hand from the Actions tab (Run workflow).
#
# A push only checks that the app compiles: the build is unsigned and thrown
# away. Started by hand (Run workflow) with the Apple secrets below in place,
# it is instead signed with the App Store distribution certificate and
# uploaded to App Store Connect, where it shows up in TestFlight a few minutes
# later. The secrets (Settings → Secrets and variables → Actions):
#
#   APPLE_TEAM_ID            the 10-character team ID (developer.apple.com → Membership details)
#   APPSTORE_ISSUER_ID       App Store Connect → Users and Access → Integrations → Team Keys
#   APPSTORE_KEY_ID          the key's ID from the same page (a team key, not an individual key)
#   APPSTORE_PRIVATE_KEY     the whole text of the downloaded AuthKey_<KEY_ID>.p8 file
#   IOS_DIST_CERT_P12        the Apple Distribution certificate and its private key as a .p12, base64
#   IOS_DIST_CERT_PASSWORD   the password the .p12 was exported with
#
# The signed build needs the on-device model, assets/model/ossia.onnx, in the
# repository; it fails early when it is missing.

name: iOS build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/ios.yml'

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    env:
      SIGNED: ${{ github.event_name == 'workflow_dispatch' && secrets.APPSTORE_KEY_ID != '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.4
          cache: true

      - name: Tool versions
        run: |
          xcodebuild -version
          flutter --version

      - name: Resolve packages
        run: flutter pub get

      - name: Check for the model
        run: |
          if [ -f assets/model/ossia.onnx ]; then
            ls -l assets/model/ossia.onnx
          elif [ "$SIGNED" = "true" ]; then
            echo "::error::assets/model/ossia.onnx isn't in the repository; a store build needs it."
            exit 1
          else
            echo "::warning::assets/model/ossia.onnx isn't in the repository, so this build has no model."
          fi

      - name: Build (unsigned)
        if: env.SIGNED != 'true'
        run: flutter build ios --release --no-codesign

      # From here on, only with the Apple secrets.

      - name: Install the certificate and the App Store Connect key
        if: env.SIGNED == 'true'
        env:
          P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
        run: |
          KEY_FILE="$RUNNER_TEMP/private_keys/AuthKey_$APPSTORE_KEY_ID.p8"
          echo "KEY_FILE=$KEY_FILE" >> "$GITHUB_ENV"
          CERT="$RUNNER_TEMP/distribution.p12"
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo -n "$P12_BASE64" | base64 --decode -o "$CERT"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          # Apple's intermediate certificate, so codesign can build the chain
          # (the runner usually has it already, which the import reports as an error)
          curl -sS -o "$RUNNER_TEMP/AppleWWDRCAG3.cer" https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer
          security import "$RUNNER_TEMP/AppleWWDRCAG3.cer" -k "$KEYCHAIN" -T /usr/bin/codesign             || echo "Apple's intermediate certificate is already installed"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"
          security find-identity -v -p codesigning "$KEYCHAIN"
          mkdir -p "$(dirname "$KEY_FILE")"
          # The key is pasted into the secret from Windows, so drop any carriage
          # returns and make sure the file ends with a line break, or Xcode
          # rejects it as an invalid PEM document.
          printf '%s\n' "$PRIVATE_KEY" | tr -d '\r' > "$KEY_FILE"
          openssl pkey -in "$KEY_FILE" -noout && echo "App Store Connect key reads fine"

      - name: Archive (signed)
        if: env.SIGNED == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          # The build number must go up with every upload; the run number does.
          flutter build ios --release --config-only --no-codesign --build-number "$GITHUB_RUN_NUMBER"
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/ios/Runner.xcarchive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_FILE" \
            -authenticationKeyID "$APPSTORE_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID"

      - name: Export the .ipa
        if: env.SIGNED == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>export</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
            <key>uploadSymbols</key>
            <true/>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/ios/Runner.xcarchive \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath build/ios/ipa \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_FILE" \
            -authenticationKeyID "$APPSTORE_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID"
          ls -l build/ios/ipa

      - name: Upload to App Store Connect
        if: env.SIGNED == 'true'
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          API_PRIVATE_KEYS_DIR: ${{ runner.temp }}/private_keys
        run: |
          IPA=$(ls build/ios/ipa/*.ipa | head -n 1)
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$APPSTORE_KEY_ID" --apiIssuer "$APPSTORE_ISSUER_ID"

      - name: Keep the .ipa
        if: env.SIGNED == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: ossia-ios-${{ github.run_number }}
          path: app/build/ios/ipa/*.ipa
          if-no-files-found: ignore
          retention-days: 30
