# Translations live in lib/l10n/app_<language>.arb; English is the template.
# `flutter pub get` (or `flutter gen-l10n`) rebuilds app_localizations*.dart.
arb-dir: lib/l10n
template-arb-file: app_en.arb
output-localization-file: app_localizations.dart
output-class: AppLocalizations
nullable-getter: false
